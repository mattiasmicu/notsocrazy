<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramp Car VS Police: CHASE</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
        }
        #gameCanvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script src="Build/CrazyGames.loader.js"></script>
    <script>
        createUnityInstance(document.getElementById("gameCanvas"), {
            dataUrl: "Build/CrazyGames.data.br",
            frameworkUrl: "Build/CrazyGames.framework.js.br",
            codeUrl: "Build/CrazyGames.wasm.br",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "CrazyGames",
            productName: "Ramp Car VS Police: CHASE",
            productVersion: "1.0"
        }).then((unityInstance) => {
            console.log("Game loaded successfully");
        }).catch((message) => {
            console.error("Unity loading error:", message);
        });
    </script>
</body>
</html>
